name: Sicherheitsbedenken
description: Melde ein sicherheitsbezogenes Problem (nur nicht-sensibel — siehe Hinweise)
title: "[Sicherheit] "
labels: ["security"]
body:
  - type: markdown
    attributes:
      value: |
        ## Wichtig: Verantwortungsvolle Offenlegung

        **Wenn du eine Sicherheitslücke gefunden hast** (z. B. unbefugten Datenzugriff, Umgehung der Authentifizierung, Injection-Schwachstelle), **poste sie NICHT hier**. Dies ist ein öffentliches Repository.

        Schreib uns stattdessen bitte direkt eine E-Mail an: **ekthunderstorminfo@gmail.com**

        Gemäß dem [Verhaltenskodex](https://github.com/erso44/Thunderstorm-Feedback#9-verhaltenskodex) versuche bitte nicht, Sicherheitsprobleme auszunutzen oder mit anderen zu teilen. Wenn du dir unsicher bist, ob etwas sensibel ist, schreib uns lieber eine E-Mail, anstatt es zu posten.

        ---

        Diese Vorlage ist nur für **nicht-sensible sicherheitsbezogene UX-Bedenken** gedacht (z. B. verwirrende Berechtigungsmeldungen, unklare Passwort-Anforderungen, fehlende HTTPS-Hinweise).

  - type: textarea
    id: description
    attributes:
      label: Was hast du beobachtet?
      description: Beschreibe das sicherheitsbezogene UX-Bedenken
      placeholder: "Mir ist aufgefallen, dass ..."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Wo hast du das gesehen?
      description: Auf welcher Seite oder in welchem Ablauf warst du?
    validations:
      required: false
