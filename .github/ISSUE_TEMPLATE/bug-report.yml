name: Fehlermeldung
description: Melde einen Fehler oder etwas, das nicht richtig funktioniert
title: "[Fehler] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Danke, dass du einen Fehler meldest! Bitte fülle die folgenden Felder aus, damit wir das Problem untersuchen können.

        **Bevor du absendest**, schau bitte in den Abschnitt [Fehlerbehebung](https://github.com/erso44/Thunderstorm-Feedback#11-fehlerbehebung) — eine schnelle Lösung ist vielleicht schon aufgeführt.

  - type: dropdown
    id: severity
    attributes:
      label: Schweregrad
      description: Wie schwerwiegend ist dieses Problem?
      options:
        - "Kritisch — Eine Kernfunktion ist unbenutzbar (Registrierung, Login, Seitenabsturz)"
        - "Schwerwiegend — Die Funktion ist defekt, aber es gibt einen Umweg"
        - "Geringfügig — Kosmetisch oder nicht blockierend"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Reproduzieren
      description: Was hast du gemacht, um diesen Fehler auszulösen?
      placeholder: |
        1. Gehe zu '...'
        2. Klicke auf '...'
        3. Scrolle nach unten zu '...'
        4. Fehler erscheint
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Ergebnis
      description: Was hätte passieren sollen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Ergebnis
      description: Was ist tatsächlich passiert?
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Welchen Browser benutzt du?
      options:
        - Google Chrome
        - Mozilla Firefox
        - Safari
        - Microsoft Edge
        - Anderer
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: Browser-Version & Betriebssystem
      description: "z. B. Chrome 122 unter Windows 11, Safari unter macOS 15"
      placeholder: "Chrome 122 unter Windows 11"
    validations:
      required: false

  - type: dropdown
    id: account-type
    attributes:
      label: Kontotyp
      description: Welche Art von Konto hast du verwendet?
      options:
        - Nutzer (Mitglied)
        - Creator / Owner
        - Nicht eingeloggt
    validations:
      required: true

  - type: input
    id: username
    attributes:
      label: Dein Benutzername
      description: "Optional — hilft uns, die Server-Logs zu deiner Sitzung zu prüfen"
      placeholder: "dein-benutzername"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Hänge nach Möglichkeit Screenshots an (per Drag & Drop oder Einfügen)
    validations:
      required: false
