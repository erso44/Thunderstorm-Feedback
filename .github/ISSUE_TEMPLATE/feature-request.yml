name: Funktionswunsch / Vorschlag
description: Schlage eine Verbesserung oder eine neue Funktion vor
title: "[Vorschlag] "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Wir schätzen deine Ideen! Sag uns, was Thunderstorm besser machen würde.

  - type: dropdown
    id: area
    attributes:
      label: Funktionsbereich
      description: Welchen Teil der Plattform betrifft das?
      options:
        - Registrierung / Login
        - Navigation / Menüs
        - Shop / Produkte
        - Community / Forum
        - Live-Streaming
        - Dashboard / Analytik
        - Einstellungen / Profil
        - Zahlung / Abo
        - Bestandsverwaltung
        - Deutsche Oberfläche / Übersetzungen
        - Sonstiges
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Was würdest du dir wünschen?
      description: Beschreibe die Funktion oder Verbesserung
      placeholder: "Ich würde gerne ..."
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Warum wäre das nützlich?
      description: Hilf uns, den Anwendungsfall oder das Problem zu verstehen, das damit gelöst würde
      placeholder: "Das würde helfen, weil ..."
    validations:
      required: false
