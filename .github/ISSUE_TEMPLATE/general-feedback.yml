name: Allgemeines Feedback
description: Teile deinen Gesamteindruck oder deine Gedanken zur Plattform
title: "[Feedback] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Wir freuen uns über jedes Feedback — positiv oder kritisch. Sag uns, was du denkst!

  - type: dropdown
    id: area
    attributes:
      label: Worum geht es bei diesem Feedback?
      description: Wähle den passendsten Bereich
      options:
        - Registrierung / Login
        - Navigation / Menüs
        - Shop / Produkte
        - Community / Forum
        - Live-Streaming
        - Dashboard / Analytik
        - Einstellungen / Profil
        - Zahlung / Abo
        - Gesamteindruck
        - Sonstiges
    validations:
      required: true

  - type: textarea
    id: feedback
    attributes:
      label: Dein Feedback
      description: Sag uns, was dir gefallen hat, was dich verwirrt hat oder was besser sein könnte
    validations:
      required: true

  - type: dropdown
    id: rating
    attributes:
      label: Bewertung des Gesamteindrucks
      description: Wie würdest du deine bisherige Erfahrung bewerten?
      options:
        - "5 — Ausgezeichnet"
        - "4 — Gut"
        - "3 — Durchschnittlich"
        - "2 — Unterdurchschnittlich"
        - "1 — Schlecht"
    validations:
      required: false
